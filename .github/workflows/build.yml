# 单一桌面入口 + 统一 PyInstaller 参数；与 apps/DesktopApp/Main.py 对齐

name: Build Desktop Releases

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt
          pip install pyinstaller
      - name: Build executable
        run: >
          pyinstaller --name MusicFriend-Desktop --onefile --windowed
          --paths src
          apps/DesktopApp/Main.py
      - uses: actions/upload-artifact@v4
        with:
          name: MusicFriend-Desktop-Windows
          path: dist/

  build-macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt
          pip install pyinstaller
      - name: Build application
        run: >
          pyinstaller --name MusicFriend-Desktop --onefile --windowed
          --paths src
          apps/DesktopApp/Main.py
      - uses: actions/upload-artifact@v4
        with:
          name: MusicFriend-Desktop-macOS
          path: dist/
